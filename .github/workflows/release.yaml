name: 🐳 Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    timeout-minutes: 10
    name: 🐳 Build and Push Docker Image
    env:
      DOCKER_BUILDKIT: 1
      LS_RELEASE_TAG: "v4.8.8"
      LS_CONTAINER_IMAGE_RELEASE_TAG: "4.8.8-2"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📅 Compute build metadata
        id: meta-build
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "version=$LS_CONTAINER_IMAGE_RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: 💿 Download linkstack release
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "LinkStackOrg/LinkStack"
          tag: "${{ env.LS_RELEASE_TAG }}"
          fileName: "linkstack.zip"
          tarBall: false
          zipBall: false
          extract: true

      - name: 🎯 Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: 🖥 Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🔓 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ vars.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: 🌐 Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7"
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/linkstack:${{ steps.meta-build.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta-build.outputs.version }}
            VCS_REF=${{ github.sha }}
            CREATED=${{ steps.meta-build.outputs.created }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 👮‍♂️ Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ vars.DOCKERHUB_USERNAME }}/linkstack
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
